name: _V2 frontend

on:
  workflow_call:
    inputs:
      source_repository: {required: true, type: string}
      source_ref: {required: true, type: string}
    secrets:
      GH_TOKEN: {required: true}

permissions:
  contents: read

jobs:
  build:
    name: main frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: corepack enable
      - name: Install frontend workspace
        working-directory: v2/main/js
        run: yarn install --immutable
      - name: Validate frontend through Storybook
        id: validate
        working-directory: v2
        run: |
          (cd main/js && yarn workspace @statstrade/storybook build)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-frontend-${{ github.run_id }}
          path: |
            v2/main/js/apps/statstrade-storybook/storybook-static
          if-no-files-found: warn
          retention-days: 14
