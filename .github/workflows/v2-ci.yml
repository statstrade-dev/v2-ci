name: V2 DB CI

on:
  repository_dispatch:
    types: [v2-db-changed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA in statstrade-dev/v2-db
        required: true
        type: string
      source_ref:
        description: Source ref containing the requested commit
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: v2-db-ci-${{ github.event.client_payload.source_sha || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: statstrade-dev/v2-db
  FOUNDATION_REPOSITORY: zcaudate-xyz/foundation-base
  FOUNDATION_SHA: f708e8cfe86371c7abbdbb3bb7cabf0a9c175836

jobs:
  test:
    name: gwdb.common, gwdb.fn, gwdb.rpc
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate source request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REQUESTED_REPOSITORY: ${{ github.event.client_payload.source_repository || env.SOURCE_REPOSITORY }}
          REQUESTED_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$REQUESTED_REPOSITORY" = "$SOURCE_REPOSITORY"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out v2-db
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2-db
          fetch-depth: 1

      - name: Check out pinned Foundation
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FOUNDATION_REPOSITORY }}
          ref: ${{ env.FOUNDATION_SHA }}
          token: ${{ secrets.GH_TOKEN }}
          path: foundation
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Foundation and link checkout
        working-directory: v2-db
        run: |
          set -euo pipefail
          mkdir -p checkouts
          ln -sfn "$GITHUB_WORKSPACE/foundation" checkouts/foundation
          ../foundation/lein install

      - name: Run database tests
        working-directory: v2-db
        run: |
          set -o pipefail
          ./lein test :with "[gwdb.common gwdb.fn gwdb.rpc]" 2>&1 | tee gwdb-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-db-gwdb-tests-${{ github.run_id }}
          path: v2-db/gwdb-test.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report source status
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish source commit status
        uses: actions/github-script@v7
        env:
          SOURCE_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
            const result = process.env.TEST_RESULT;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              state,
              context: 'v2-ci/gwdb',
              description: state === 'success' ? 'gwdb tests passed' : 'gwdb tests failed',
              target_url: process.env.RUN_URL,
            });
