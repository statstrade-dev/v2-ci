name: _V2 documentation validation

on:
  workflow_call:
    inputs:
      source_repository: {required: true, type: string}
      source_ref: {required: true, type: string}
    secrets:
      GH_TOKEN: {required: true}

permissions:
  contents: read

jobs:
  build:
    name: Docusaurus and Build Portal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: v2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Build business-plan PDFs
        working-directory: v2
        run: |
          docs/business-plan/install-deps.sh
          make -C docs/business-plan publish
          test -f docs-gen/static/documents/business-plan/business-plan.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/bondi-surf-life-saving-club.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/community-strong-australia.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/city2surf-organisers.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/australian-red-cross-community-readiness.pdf
          test -f docs-gen/static/documents/business-plan/case-studies/reckless-ben-bricks-and-minifigs-accountability.pdf
      - name: Install frontend dependencies
        working-directory: v2/main/js
        run: corepack yarn install --immutable
      - name: Build documentation and portal
        id: build
        working-directory: v2
        env:
          DEPLOY_CONTEXT: deploy-preview
        run: |
          cp main/js/apps/statstrade-build/netlify.toml netlify.toml
          trap 'rm -f netlify.toml' EXIT
          npx --yes netlify-cli@26.2.0 build --offline --filter @statstrade/build-portal --context "$DEPLOY_CONTEXT"
          test -f main/js/.netlify/static/docs/index.html
          test -d main/js/.netlify/static/_next/static
          test -f main/js/.netlify/functions/manifest.json
          test -f main/js/.netlify/functions/identity-login.zip
          test -f main/js/.netlify/functions/identity-signup.zip
          test -f main/js/.netlify/functions/___netlify-server-handler.zip
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-build-portal-${{ github.run_id }}
          path: |
            v2/main/js/apps/statstrade-build/public/docs
            v2/main/js/apps/statstrade-build/.next/BUILD_ID
            v2/main/js/apps/statstrade-build/.next/build-manifest.json
          if-no-files-found: warn
          retention-days: 14
